[supervisord]
nodaemon=true

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24
autorestart=true

[program:openbox]
command=openbox
environment=DISPLAY=":99"
autorestart=true

[program:openrocket]
command=/bin/sh -c "/app/bin/$(ls /app/bin | grep -v '\\.bat$' | head -n 1)"
environment=DISPLAY=":99"
autorestart=true

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autorestart=true

[program:novnc]
command=websockify --web=/usr/share/novnc 8080 localhost:5900
autorestart=true
